<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <el-container>
        <el-header>
            <h2>用户管理系统</h2>
        </el-header>
        <el-main>
            <!-- 搜索表单 -->
            <el-form :inline="true" :model="searchForm" class="search-form">
                <el-form-item label="姓名">
                    <el-input v-model="searchForm.name" placeholder="请输入姓名" clearable></el-input>
                </el-form-item>
                <el-form-item label="年龄">
                    <el-input v-model="searchForm.age" placeholder="请输入年龄" clearable @input="validateAge(searchForm.age)"></el-input>
                    <div class="error-message" v-if="ageError">{{ ageError }}</div>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="searchUsers">查询</el-button>
                    <el-button @click="resetSearch">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <div class="operation-buttons">
                <el-button type="primary" @click="showAddDialog">新增用户</el-button>
                <el-button type="danger" :disabled="selectedUsers.length === 0" @click="batchDeleteUsers">批量删除</el-button>
                <span class="user-count">用户总数: {{userCount}}</span>
            </div>

            <!-- 用户表格 -->
            <el-table
                    :data="userList"
                    border
                    style="width: 100%"
                    @selection-change="handleSelectionChange">
                <el-table-column
                        type="selection"
                        width="55">
                </el-table-column>
                <el-table-column
                        label="序号"
                        width="80">
                        <template slot-scope="scope">
                        {{ (pagination.current - 1) * pagination.size + scope.$index + 1 }}
                        </template>
                </el-table-column>
                <el-table-column
                        prop="name"
                        label="姓名"
                        width="180">
                </el-table-column>
                <el-table-column
                        prop="age"
                        label="年龄"
                        width="100">
                </el-table-column>
                <el-table-column
                        label="操作"
                        width="200">
                    <template slot-scope="scope">
                        <el-button
                                size="mini"
                                @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button
                                size="mini"
                                type="danger"
                                @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="pagination.current"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pagination.size"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="pagination.total">
            </el-pagination>

            <!-- 新增/编辑用户对话框 -->
            <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="30%">
                <el-form :model="userForm" :rules="rules" ref="userForm" label-width="80px">
                    <el-form-item label="姓名" prop="name">
                        <el-input v-model="userForm.name"></el-input>
                    </el-form-item>
                    <el-form-item label="年龄" prop="age">
                        <el-input v-model.number="userForm.age" @input="validateAge(userForm.age)"></el-input>
                        <div class="error-message" v-if="ageError">{{ ageError }}</div>
                    </el-form-item>
                </el-form>
                <span slot="footer" class="dialog-footer">
                        <el-button @click="dialogVisible = false">取 消</el-button>
                        <el-button type="primary" @click="submitForm">确 定</el-button>
                    </span>
            </el-dialog>
        </el-main>
    </el-container>
</div>

<script src="ui/vue.min.js"></script>
<script src="ui/element-ui.js"></script>
<script src="ui/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
